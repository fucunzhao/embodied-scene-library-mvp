<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldbook · 具身智能场景库</title><style>
:root{--ink:#14251f;--muted:#687771;--line:#dfe7e2;--paper:#f6f8f5;--card:#fff;--green:#176b4d;--green2:#0f4a36;--lime:#dcef9d;--blue:#e5f1fb;--orange:#fff0d0;--red:#fae0df;--shadow:0 12px 36px #173a2e12}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;gap:23px;position:sticky;top:0;z-index:10}.brand{font-size:20px;font-weight:850;letter-spacing:-.8px}.brand i{color:var(--green);font-style:normal}nav{display:flex;gap:3px}nav button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:7px;cursor:pointer}nav button.active,nav button:hover{background:#eaf5ee;color:var(--green)}.spacer{flex:1}.identity{font-size:12px;color:var(--green);font-weight:700;text-align:right}.logout{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 10px;border-radius:7px;cursor:pointer}.wrap{max-width:1360px;margin:auto;padding:28px 30px 60px}.view{display:none}.view.active{display:block}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;margin-bottom:24px}.hero-main{background:linear-gradient(125deg,var(--green),#0b3c2c);color:white;border-radius:18px;padding:27px 30px;min-height:198px}.kicker{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.hero-main .kicker{color:#b5d8c9}.hero-main h1{font-size:29px;letter-spacing:-1px;line-height:1.25;margin:7px 0}.hero-main p{margin:0;color:#d4e7dd;max-width:620px}.metrics{display:flex;gap:20px;margin-top:19px}.metrics b{display:block;font-size:20px}.metrics span{font-size:12px;color:#cce0d6}.hero-side{background:var(--lime);border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:space-between}.hero-side h2{font-size:20px;line-height:1.3;margin:7px 0}.hero-side p{color:#4c5e52;margin:0}.primary,.secondary{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green2)}.secondary{background:#edf2ee;color:var(--green)}.toolbar{display:flex;gap:9px;align-items:center;margin:17px 0}.search,.filter,.field input,.field select,.field textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink)}.search{min-width:280px}.result{margin-left:auto;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.scene{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 1px 1px #12241a08;cursor:pointer;transition:.18s}.scene:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.cover{height:125px;position:relative;padding:13px;overflow:hidden}.cover:before{content:"";position:absolute;right:-16px;bottom:-63px;width:170px;height:170px;border-radius:50%;background:#ffffffa8}.cover:after{content:"";position:absolute;right:60px;top:-34px;width:80px;height:80px;border-radius:50%;background:#fff9}.cover b{position:relative;z-index:1;padding:4px 8px;background:#fffC;border-radius:12px;font-size:11px}.home{background:#cce8da}.retail{background:#d8edfb}.factory{background:#ffe7bc}.custom-cover{background:#e3eadf}.custom-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.scene-body{padding:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:var(--muted)}.scene h3{font-size:17px;margin:7px 0 3px}.pill{font-size:11px;padding:3px 7px;border-radius:5px;background:#edf2ef;color:#52635b;white-space:nowrap}.ready,.approved,.done{background:#dff2e7;color:#176b4d}.pending,.review{background:#fff0c9;color:#7c5a08}.rejected{background:var(--red);color:#a23d3b}.media-dot{font-size:11px;color:var(--green);margin-top:9px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.section-head h1,.section-head h2{margin:3px 0 0;font-size:24px;letter-spacing:-.6px}.notice{background:var(--orange);color:#755817;padding:11px 13px;border-radius:8px;margin-bottom:15px;font-size:13px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.column{border-radius:11px;background:#edf2ef;padding:11px;min-height:300px}.column header{font-weight:750;display:flex;justify-content:space-between;margin-bottom:9px}.count{font-size:11px;background:#fff;border-radius:10px;padding:2px 7px;color:var(--muted)}.task{background:#fff;border-radius:8px;padding:11px;margin:8px 0;box-shadow:0 1px 1px #13251c0c}.task b{display:block}.task small{display:block;color:var(--muted);margin-top:4px}.task .task-actions{display:flex;gap:6px;margin-top:8px}.small-btn{border:0;border-radius:6px;background:#edf3ef;color:var(--green);padding:5px 7px;font-size:11px;cursor:pointer;font-weight:650}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:11px}.table th{font-size:12px;color:var(--muted);background:#f8faf8}.table tr:last-child td{border:0}.tabs{display:flex;gap:7px;margin-bottom:17px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;cursor:pointer;color:var(--muted)}.tabs button.active{background:var(--green);border-color:var(--green);color:#fff}.form{max-width:790px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700}.field.full{grid-column:1/-1}.field textarea{resize:vertical}.help{font-size:12px;color:var(--muted)}.files{display:flex;flex-wrap:wrap;gap:6px}.success{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:#dff2e7;color:var(--green)}.success.show{display:block}.empty{background:#fff;border:1px dashed #ccd8d1;color:var(--muted);border-radius:10px;padding:30px;text-align:center}.modal{position:fixed;inset:0;background:#07170f85;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.open{display:flex}.dialog{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:15px;background:#fff;padding:25px;box-shadow:0 30px 60px #0004}.close{position:absolute;right:16px;top:14px;border:0;border-radius:7px;width:31px;height:31px;font-size:20px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail{background:#f4f7f4;border-radius:8px;padding:10px}.detail small{color:var(--muted);display:block}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.gallery img,.gallery video{width:100%;height:125px;border-radius:7px;object-fit:cover;background:#e7ece8}.inquiry{background:var(--blue);padding:14px;border-radius:9px;margin-top:17px}.hide{display:none!important}@media(max-width:860px){.hero,.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}.top,.wrap{padding-left:16px;padding-right:16px}.top{gap:10px}.identity{display:none}nav{overflow:auto}.toolbar{flex-wrap:wrap}.result{margin-left:0}.search{min-width:100%}}@media(max-width:520px){.board,.form-grid,.detail-grid{grid-template-columns:1fr}.metrics{gap:12px}.metrics b{font-size:17px}.gallery{grid-template-columns:1fr 1fr}.top{height:auto;min-height:64px}.brand{font-size:16px}}
</style></head><body><header class="top"><div class="brand">FIELD<i>BOOK</i></div><nav><button data-view="library" class="active">场景库</button><button data-view="workbench">工作台</button></nav><div class="spacer"></div><span class="identity" id="identity"></span><button class="logout" onclick="logout()">退出登录</button></header><main class="wrap">
<section id="library" class="view active"><div class="hero"><div class="hero-main"><div class="kicker">Embodied AI data operations</div><h1>真实操作场景，转化为可交付的数据资产。</h1><p>按行业、任务与数据模态浏览已经验证的采集场景；素材与详细能力按角色安全展示。</p><div class="metrics"><div><b id="sceneMetric">0</b><span>已收录场景</span></div><div><b id="readyMetric">0</b><span>可立即采集</span></div><div><b id="mediaMetric">0</b><span>场景素材</span></div></div></div><div class="hero-side"><div><div class="kicker">当前入口</div><h2 id="sideTitle">查看可采集场景与样例</h2><p id="sideText">了解环境、任务、数据模态与交付能力。</p></div><button class="primary" id="sideAction" onclick="goToRoleAction()">浏览场景库 →</button></div></div><div class="toolbar"><input class="search" id="search" placeholder="搜索任务、环境或物品…" oninput="renderLibrary()"><select class="filter" id="industry" onchange="renderLibrary()"><option value="all">全部行业</option><option>家庭服务</option><option>零售服务</option><option>工业制造</option><option>物流仓储</option></select><select class="filter" id="availability" onchange="renderLibrary()"><option value="all">全部状态</option><option>可立即采集</option><option>方案评估中</option></select><span class="result" id="result"></span></div><div class="grid" id="sceneGrid"></div></section>
<section id="workbench" class="view"></section></main><div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const baseScenes=[{id:'s1',name:'厨房台面整理',industry:'家庭服务',status:'可立即采集',place:'杭州 · 真实住宅厨房',task:'收纳、擦拭、餐具分类',data:'双目视频 · 深度 · 末端轨迹',cycle:'5–10 天',scale:'100–300 小时',type:'home',tags:['双臂操作','精细抓取','家居'],desc:'覆盖餐后整理、厨具归位、台面擦拭等高频家庭操作，支持多种光照与物品状态。'},{id:'s2',name:'便利店商品抓取',industry:'零售服务',status:'可立即采集',place:'上海 · 连锁便利店',task:'货架抓取、扫码、补货',data:'第一/第三视角视频 · 语音',cycle:'7–14 天',scale:'200–500 小时',type:'retail',tags:['货架','多品类','人机协作'],desc:'在真实营业环境中采集商品识别、抓取、放置与顾客避让任务。'},{id:'s3',name:'产线螺钉分拣',industry:'工业制造',status:'可立即采集',place:'苏州 · 电子装配车间',task:'识别、抓取、分拣、装盒',data:'视频 · 点云 · 力控 · 关节状态',cycle:'10–15 天',scale:'300–800 小时',type:'factory',tags:['工业机械臂','精密件','力控'],desc:'涵盖混料识别、细小零件抓取与工位间转运，支持标准化与干扰样本采集。'},{id:'s4',name:'快递包裹搬运',industry:'物流仓储',status:'可立即采集',place:'宁波 · 分拨中心',task:'识别、搬运、码放',data:'视频 · 深度 · 轨迹',cycle:'10–20 天',scale:'500–1,000 小时',type:'factory',tags:['移动操作','大负载','仓储'],desc:'覆盖包裹抓取、笼车转运、堆叠及动态障碍回避。'},{id:'s5',name:'商超货架补货',industry:'零售服务',status:'方案评估中',place:'北京 · 社区商超',task:'缺货识别、补货、整理',data:'视频 · 语音 · 轨迹',cycle:'待评估',scale:'待评估',type:'retail',tags:['长货架','库存识别','补货'],desc:'拟覆盖高峰期与非高峰期的真实商超补货操作场景。'}];
let session=null, role='client', scenes=[], applications=[], tasks=[], inquiries=[], accounts=[];
function save(){}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function mediaCount(x){return (x.photos||[]).length+(x.videos||[]).length}function sceneStatusClass(s){return s==='可立即采集'?'ready':s==='已审批'?'approved':'pending'}
function roleFromAccount(a){return a.role==='供应商'?'supplier':a.role==='客户'?'client':'internal'}function setRole(){}function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function renderAll(){const me=accounts.find(a=>a.id===session?.accountId);document.getElementById('identity').textContent=me?`${me.name} · ${me.role}`:'未登录';const copy={client:['查看可采集场景与样例','了解环境、任务、数据模态与交付能力。','浏览场景库 →'],internal:['审核场景，统筹采集','处理供应商申报、创建任务并下发执行。','进入内部工作台 →'],supplier:['申报场景或领取任务','上传现场素材，查看审核结果与可领取任务。','进入供应商工作台 →']}[role];document.getElementById('sideTitle').textContent=copy[0];document.getElementById('sideText').textContent=copy[1];document.getElementById('sideAction').textContent=copy[2];renderLibrary();renderWorkbench()}function goToRoleAction(){role==='client'?switchView('library'):switchView('workbench')}function openLogin(){}function login(){}function logout(){}function bootstrap(){}
function renderLibrary(){const q=(document.getElementById('search').value||'').toLowerCase(),i=document.getElementById('industry').value,a=document.getElementById('availability').value;const list=scenes.filter(x=>(i==='all'||x.industry===i)&&(a==='all'||x.status===a)&&Object.values(x).join(' ').toLowerCase().includes(q));document.getElementById('sceneMetric').textContent=scenes.length;document.getElementById('readyMetric').textContent=scenes.filter(x=>x.status==='可立即采集').length;document.getElementById('mediaMetric').textContent=scenes.reduce((n,x)=>n+mediaCount(x),0);document.getElementById('result').textContent=`找到 ${list.length} 个场景`;document.getElementById('sceneGrid').innerHTML=list.length?list.map(x=>`<article class="scene" onclick="showScene('${x.id}')"><div class="cover ${x.type||'custom-cover'}">${x.photos&&x.photos[0]?`<img src="${x.photos[0]}">`:''}<b>${esc(x.industry)}</b></div><div class="scene-body"><div class="row"><span class="muted" style="font-size:12px">${esc(x.place)}</span><span class="pill ${sceneStatusClass(x.status)}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><div class="muted" style="font-size:13px">${esc(x.task)}</div><div class="media-dot">${mediaCount(x)?`● ${mediaCount(x)} 个现场素材`:'○ 场景资料待补充'}</div></div></article>`).join(''):'<div class="empty">没有匹配场景，请调整筛选条件。</div>'}
function showScene(id){const x=scenes.find(s=>s.id===id),canSeeMedia=role==='client'||role==='internal'||role==='supplier';let media='';if(canSeeMedia&&mediaCount(x)){media=`<h3 style="font-size:16px">现场图片与任务视频</h3><div class="gallery">${(x.photos||[]).map(p=>`<img src="${p}">`).join('')}${(x.videos||[]).map(v=>`<video controls src="${v}"></video>`).join('')}</div>`}else if(role==='client'){media='<div class="notice">该场景的样例素材正在补充，您可提交需求后获取进一步资料。</div>'}document.getElementById('modalContent').innerHTML=`<div class="kicker" style="color:var(--green)">${esc(x.industry)} · ${esc(x.status)}</div><h2 style="margin:5px 35px 5px 0">${esc(x.name)}</h2><p class="muted">${esc(x.desc)}</p><div class="detail-grid"><div class="detail"><small>采集环境</small><b>${esc(x.place)}</b></div><div class="detail"><small>核心任务</small><b>${esc(x.task)}</b></div><div class="detail"><small>数据模态</small><b>${esc(x.data)}</b></div><div class="detail"><small>交付能力</small><b>${esc(x.scale)} / ${esc(x.cycle)}</b></div></div>${media}${role==='client'?`<div class="inquiry"><b>咨询此场景</b><div style="display:flex;gap:8px;margin-top:9px"><input id="inquiryContact" placeholder="姓名或邮箱/电话" style="flex:1;border:1px solid #c9dbeb;border-radius:7px;padding:8px"><button class="primary" onclick="submitInquiry('${x.id}')">提交需求</button></div></div>`:''}`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function submitInquiry(){}
function renderWorkbench(){const el=document.getElementById('workbench');if(role==='internal')el.innerHTML=internalHTML();else if(role==='supplier')el.innerHTML=supplierHTML();else el.innerHTML=clientHTML()}
function internalHTML(){const pending=applications.filter(x=>x.status==='待审核');const stages=['待领取','已排期','采集中','验收交付'];return `<div class="section-head"><div><div class="kicker" style="color:var(--green)">Internal operations</div><h1>内部运营工作台</h1></div><button class="primary" onclick="openTaskForm()">+ 创建采集任务</button></div><div class="tabs"><button class="active" onclick="showInternalTab('plan',this)">采集计划</button><button onclick="showInternalTab('audit',this)">场景审核 <b>${pending.length}</b></button><button onclick="showInternalTab('inquiries',this)">客户询盘 ${inquiries.length}</button><button onclick="showInternalTab('accounts',this)">账号管理 ${accounts.length}</button></div><div id="internalPanel"><div class="notice">任务创建后可指派给供应商，或设置为“待领取”并开放至供应商任务池。</div><div class="board">${stages.map(st=>`<div class="column"><header>${st}<span class="count">${tasks.filter(t=>t.stage===st).length}</span></header>${tasks.filter(t=>t.stage===st).map(t=>`<div class="task"><b>${esc(t.name)}</b><small>${t.supplier?`${esc(t.supplier)} · `:''}${esc(t.date)}</small><div class="task-actions"><button class="small-btn" onclick="advanceTask('${t.id}')">推进状态</button><button class="small-btn" onclick="taskDetail('${t.id}')">详情</button></div></div>`).join('')||'<small class="muted">暂无任务</small>'}</div>`).join('')}</div></div>`}
function auditPanel(){const rows=applications.filter(x=>x.status==='待审核');return rows.length?`<div class="notice">请先预览现场图片与任务视频，再执行通过或退回。审核结论会同步至供应商的“我的申报”。</div><table class="table"><thead><tr><th>场景</th><th>地点 / 素材</th><th>申报时间</th><th>审核操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.industry)} · ${esc(x.task)}</small></td><td>${esc(x.place)}<br><small class="muted">${x.photos.length} 张图片 / ${x.videos.length} 段视频</small></td><td>${x.date}</td><td><button class="small-btn" onclick="appDetail('${x.id}')">预览申报与素材</button><br><span style="display:inline-block;height:5px"></span><button class="small-btn" onclick="reviewApplication('${x.id}','approve')">通过</button> <button class="small-btn" onclick="reviewApplication('${x.id}','reject')">退回</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无待审核场景申报。</div>'}function inquiriesPanel(){return inquiries.length?`<table class="table"><thead><tr><th>场景</th><th>客户联系方式</th><th>提交日期</th></tr></thead><tbody>${inquiries.map(x=>`<tr><td>${esc((scenes.find(s=>s.id===x.sceneId)||{}).name||'已归档场景')}</td><td>${esc(x.contact)}</td><td>${x.date}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚未收到客户询盘。</div>'}function accountPanel(){return `<div class="notice">账号与角色采用最小权限原则：平台管理员管理全局配置；内部运营审核与下发；供应商仅管理自身申报和任务；客户仅浏览被授权的场景与自身询盘。</div><div class="section-head" style="margin-top:18px"><h2>账号列表</h2><button class="primary" onclick="openAccountForm()">+ 新建账号</button></div><table class="table"><thead><tr><th>账号</th><th>角色 / 组织</th><th>权限范围</th><th>状态</th><th>操作</th></tr></thead><tbody>${accounts.map(a=>`<tr><td><b>${esc(a.name)}</b><br><small class="muted">${esc(a.email)}</small></td><td>${esc(a.role)}<br><small class="muted">${esc(a.org)}</small></td><td>${esc(a.scope)}</td><td><span class="pill ${a.status==='启用'?'approved':'rejected'}">${a.status}</span></td><td><button class="small-btn" onclick="openAccountForm('${a.id}')">编辑</button> <button class="small-btn" onclick="toggleAccount('${a.id}')">${a.status==='启用'?'停用':'启用'}</button></td></tr>`).join('')}</tbody></table>`}function showInternalTab(kind,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('internalPanel').innerHTML=kind==='audit'?auditPanel():kind==='inquiries'?inquiriesPanel():kind==='accounts'?accountPanel():internalHTML().match(/<div id="internalPanel">([\s\S]*)<\/div>$/)[1]}
function supplierHTML(){const mine=applications;const available=tasks.filter(t=>t.stage==='待领取');const claimed=tasks.filter(t=>t.supplier==='当前供应商');return `<div class="section-head"><div><div class="kicker" style="color:var(--green)">Supplier portal</div><h1>供应商工作台</h1></div><button class="primary" onclick="openApplyForm()">+ 申报新场景</button></div><div class="tabs"><button class="active" onclick="showSupplierTab('tasks',this)">可领取任务 <b>${available.length}</b></button><button onclick="showSupplierTab('mine',this)">我的申报</button><button onclick="showSupplierTab('claimed',this)">已领取任务 ${claimed.length}</button></div><div id="supplierPanel">${supplierTaskPanel()}</div>`}function supplierTaskPanel(){const list=tasks.filter(t=>t.stage==='待领取');return list.length?`<div class="grid">${list.map(t=>`<div class="scene"><div class="cover factory"><b>公开任务</b></div><div class="scene-body"><h3>${esc(t.name)}</h3><div class="muted">计划：${esc(t.date)}</div><button class="primary" style="margin-top:12px" onclick="claimTask('${t.id}')">领取任务</button></div></div>`).join('')}</div>`:'<div class="empty">暂时没有可领取任务。</div>'}function supplierMinePanel(){return `<table class="table"><thead><tr><th>场景</th><th>素材</th><th>提交时间</th><th>审核状态</th><th>操作</th></tr></thead><tbody>${applications.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.place)}</small></td><td>${x.photos.length} 图 / ${x.videos.length} 视频</td><td>${x.date}</td><td><span class="pill ${x.status==='已通过'?'approved':x.status==='已退回'?'rejected':'review'}">${x.status}</span></td><td><button class="small-btn" onclick="appDetail('${x.id}')">查看</button></td></tr>`).join('')}</tbody></table>`}function supplierClaimedPanel(){const list=tasks.filter(t=>t.supplier==='当前供应商');return list.length?`<table class="table"><thead><tr><th>任务</th><th>计划</th><th>状态</th><th>动作</th></tr></thead><tbody>${list.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.date)}</td><td><span class="pill ready">${t.stage}</span></td><td><button class="small-btn" onclick="supplierStart('${t.id}')">开始执行</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚未领取任何任务。</div>'}function showSupplierTab(k,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('supplierPanel').innerHTML=k==='mine'?supplierMinePanel():k==='claimed'?supplierClaimedPanel():supplierTaskPanel()}
function clientHTML(){const rows=inquiries.length?`<table class="table"><thead><tr><th>场景</th><th>提交时间</th><th>状态</th></tr></thead><tbody>${inquiries.map(x=>`<tr><td>${esc((scenes.find(s=>s.id===x.sceneId)||{}).name||'场景')}</td><td>${x.date}</td><td><span class="pill review">已收到</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">您还没有提交询盘。前往“场景库”查看并咨询感兴趣的场景。</div>';return `<div class="section-head"><div><div class="kicker" style="color:var(--green)">Client portal</div><h1>客户资料与询盘</h1></div></div><div class="notice">客户可在场景详情页查看可公开的图片、视频、数据模态和交付能力，并提交需求。</div><div class="section-head" style="margin-top:24px"><h2>我的询盘</h2></div>${rows}`}
function openAccountForm(id){const a=accounts.find(x=>x.id===id)||{name:'',email:'',role:'供应商',org:'',scope:'申报、领取与执行任务'};document.getElementById('modalContent').innerHTML=`<div class="kicker" style="color:var(--green)">Account management</div><h2>${id?'编辑账号':'新建账号'}</h2><form class="form" onsubmit="saveAccount(event,'${id||''}')"><div class="form-grid"><div class="field"><label>姓名 / 企业名称 *</label><input name="name" required value="${esc(a.name)}"></div><div class="field"><label>登录邮箱 *</label><input name="email" type="email" required value="${esc(a.email)}"></div><div class="field"><label>账号角色 *</label><select name="role" onchange="suggestScope(this.value)">${['平台管理员','内部运营','供应商','客户'].map(r=>`<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>所属组织 *</label><input name="org" required value="${esc(a.org)}"></div><div class="field full"><label>权限范围</label><input id="accountScope" name="scope" required value="${esc(a.scope)}"><small class="help">演示版允许调整；生产环境应由角色模板生成，不应手工授予越权权限。</small></div></div><button class="primary" style="margin-top:15px">保存账号</button></form>`;document.getElementById('modal').classList.add('open')}function suggestScope(v){const m={'平台管理员':'全部权限','内部运营':'场景审核、任务管理','供应商':'申报、领取与执行任务','客户':'场景库、询盘'};document.getElementById('accountScope').value=m[v]}function saveAccount(){}function toggleAccount(){}
function openApplyForm(){document.getElementById('modalContent').innerHTML=`<div class="kicker" style="color:var(--green)">Supplier application</div><h2>申报可采集场景</h2><p class="muted">图片至少 1 张；视频可选。素材仅供审核与受权限控制的客户展示。</p><form class="form" onsubmit="submitApplication(event)"><div class="form-grid"><div class="field"><label>场景名称 *</label><input name="name" required placeholder="例如：社区生鲜店货架补货"></div><div class="field"><label>所属行业 *</label><select name="industry" required><option>家庭服务</option><option>零售服务</option><option>工业制造</option><option>物流仓储</option></select></div><div class="field"><label>所在城市 *</label><input name="place" required></div><div class="field"><label>可用周期</label><input name="period" placeholder="例如：2026年10月至12月"></div><div class="field full"><label>可执行任务 *</label><textarea name="task" required rows="3" placeholder="描述任务步骤、物品与现场条件"></textarea></div><div class="field"><label>数据模态</label><select name="data"><option>第一/第三视角视频</option><option>视频 + 深度/点云</option><option>视频 + 力控/轨迹</option><option>多模态全量采集</option></select></div><div class="field"><label>联系人 *</label><input name="contact" required placeholder="姓名 / 手机号"></div><div class="field full"><label>现场图片 *</label><input id="applyPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple required onchange="fileNames(this,'applyPhotoNames')"><small class="help">JPG / PNG / WebP；建议场地、工位及典型物品各一张。</small><div class="files" id="applyPhotoNames"></div></div><div class="field full"><label>任务演示视频</label><input id="applyVideos" type="file" accept="video/mp4,video/webm,video/quicktime" multiple onchange="fileNames(this,'applyVideoNames')"><small class="help">MP4 / WebM / MOV；建议上传 10–60 秒的典型任务片段。</small><div class="files" id="applyVideoNames"></div></div><div class="field full"><label>补充说明</label><textarea name="note" rows="2"></textarea></div></div><button class="primary" style="margin-top:15px">提交审核</button></form>`;document.getElementById('modal').classList.add('open')}function fileNames(input,id){document.getElementById(id).innerHTML=[...input.files].map(f=>`<span class="pill ready">${esc(f.name)} · ${(f.size/1024/1024).toFixed(1)}MB</span>`).join('')}function toData(){}function submitApplication(){}
function reviewApplication(){}function appDetail(id){const a=applications.find(x=>x.id===id);document.getElementById('modalContent').innerHTML=`<div class="kicker" style="color:var(--green)">场景申报 · ${a.status}</div><h2>${esc(a.name)}</h2><p><b>地点：</b>${esc(a.place)}　<b>联系人：</b>${esc(a.contact)}</p><p class="muted">${esc(a.task)}</p><div class="gallery">${a.photos.map(p=>`<img src="${p}">`).join('')}${a.videos.map(v=>`<video controls src="${v}"></video>`).join('')}</div><p class="muted">${esc(a.note||'无补充说明')}</p>`;document.getElementById('modal').classList.add('open')}
function openTaskForm(){}function createTask(){}function claimTask(){}function supplierStart(){}function advanceTask(){}function taskDetail(id){const t=tasks.find(x=>x.id===id);document.getElementById('modalContent').innerHTML=`<div class="kicker" style="color:var(--green)">${t.stage}</div><h2>${esc(t.name)}</h2><div class="detail-grid"><div class="detail"><small>计划周期</small><b>${esc(t.date)}</b></div><div class="detail"><small>执行供应商</small><b>${esc(t.supplier||'待领取')}</b></div><div class="detail"><small>内部负责人</small><b>${esc(t.owner||'待指定')}</b></div><div class="detail"><small>当前进度</small><b>${t.progress}%</b></div></div>`;document.getElementById('modal').classList.add('open')}

</script><script src="/backend-client.js"></script></body></html>
